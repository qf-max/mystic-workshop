body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(7,11,22,.82),rgba(7,11,22,.88)),radial-gradient(ellipse at 20% 0%,rgba(91,141,239,.07),transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(212,168,67,.05),transparent 50%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:10px}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:8px;margin-bottom:10px;flex-wrap:wrap}
.topbar h1{font-size:16px;color:var(--gold);letter-spacing:2px;font-weight:600}
.player-tabs{display:flex;gap:6px}
.player-tab{padding:5px 14px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:12px;color:var(--text-dim);transition:all .2s}
.player-tab.active{background:var(--gold);color:#1a1208;border-color:var(--gold);font-weight:600}
.stats{display:flex;gap:16px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{display:flex;align-items:center;gap:5px;font-size:12px}
.stat label{color:var(--text-dim)}
.stat val{color:var(--text-bright);font-weight:600;font-size:14px}
.ap-dots{display:flex;gap:3px}
.ap-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold-dim);background:transparent}
.ap-dot.on{background:var(--gold);box-shadow:0 0 6px rgba(212,168,67,.5)}

/* 牌组内资源统计（按组展示，跟随对应牌组） */
.group-res{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;margin-top:6px;padding:5px 6px;border:1px solid var(--border);border-radius:5px;background:rgba(0,0,0,.18)}
.group-res .grp-tag{grid-column:1/-1;font-size:9px;font-weight:700;letter-spacing:.5px;margin-bottom:1px;color:var(--gold-dim)}
.group-res .grp-row{display:flex;align-items:center;gap:3px;font-size:10px;min-width:0}
.group-res .grp-row .res-ico{width:11px;height:11px;flex-shrink:0}
.group-res .grp-row .res-name{color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-res .grp-row val{font-weight:700;font-size:11px;margin-left:auto}

/* 组技能栏（可用/不可用） */
.group-skills{margin-top:6px;padding:5px 6px;border:1px solid var(--border);border-radius:5px;background:rgba(0,0,0,.18)}
.group-skills .sk-tag{font-size:9px;font-weight:700;letter-spacing:.5px;margin-bottom:3px;color:var(--gold-dim)}
.group-skills .sk-row{display:flex;align-items:center;gap:5px;font-size:10px;padding:2px 0;border-bottom:1px dashed rgba(42,58,92,.4)}
.group-skills .sk-row:last-child{border-bottom:none}
.group-skills .sk-letter{width:14px;height:14px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#1a1208;flex-shrink:0}
.group-skills .sk-lv{margin-left:2px;font-size:8px;font-weight:700;color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:0 3px;flex-shrink:0}
.group-skills .sk-state{margin-left:auto;font-size:9px;padding:1px 6px;border-radius:8px;white-space:nowrap}
.group-skills .sk-req{font-size:9px;color:var(--text-dim);display:inline-flex;align-items:center;gap:3px;flex-shrink:0}
.group-skills .sk-req .req-ico{width:14px;height:14px}
.group-skills .sk-row.ok .sk-state{background:rgba(106,191,75,.18);color:var(--B)}
.group-skills .sk-row.no .sk-state{background:rgba(224,112,112,.15);color:#e07070}
.group-skills .sk-row.view .sk-state{background:rgba(122,138,168,.15);color:var(--text-dim)}
.group-skills .sk-info{margin-left:2px;width:16px;height:16px;border-radius:50%;background:rgba(122,138,168,.16);color:var(--text-dim);border:1px solid var(--border);font-size:9px;cursor:pointer;line-height:1;flex-shrink:0;padding:0}
.group-skills .sk-info:hover{color:var(--text-bright);border-color:var(--gold-dim)}
.group-skills .sk-trigger{margin-left:2px;font-size:9px;padding:1px 8px;border-radius:3px;background:var(--B);color:#08120a;border:none;cursor:pointer;font-weight:700;flex-shrink:0;font-family:inherit}
.group-skills .sk-trigger:hover{filter:brightness(1.18)}

/* 牌组区 */
.groups-zone{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.groups-zone h3{font-size:12px;color:var(--gold);margin-bottom:8px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.groups-zone h3 .cnt{color:var(--text-dim);font-weight:400;font-size:11px}
.group-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.group{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;min-width:220px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11px}
.group-type{padding:2px 8px;border-radius:3px;font-weight:700;font-size:10px;background:rgba(212,168,67,.12);color:var(--gold);border:1px solid var(--gold-dim)}
.group-cnt{color:var(--text-dim)}
.group .stack-area{position:relative;min-height:140px}
/* 遮盖方式角标（非顶卡） */
.cover-ind{position:absolute;top:0;left:0;width:0;height:0;border-top:11px solid var(--C);border-right:11px solid transparent;cursor:pointer;z-index:2}
.cover-ind.skill{border-top-color:var(--T)}

/* 卡牌（横版圆角长方形） */
.card{width:185px;height:130px;background:linear-gradient(160deg,#1a2440,#111a2e);border:1px solid var(--gold-dim);border-radius:10px;position:relative;cursor:pointer;transition:transform .15s,box-shadow .15s;flex-shrink:0;user-select:none}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 20px rgba(212,168,67,.25);border-color:var(--gold)}
.card.selected{border-color:var(--gold);box-shadow:0 0 12px rgba(212,168,67,.5);transform:translateY(-6px)}
.card.flipped{background:linear-gradient(160deg,#2a1f0e,#1a1408);border-color:var(--gold)}
.card .cname{position:absolute;top:3px;left:2px;right:2px;text-align:center;font-size:11px;font-weight:600;color:var(--text-bright);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .clevel{position:absolute;top:3px;right:4px;font-size:9px;color:var(--gold);font-weight:700}
.card .cscore{position:absolute;bottom:3px;right:4px;font-size:10px;color:var(--gold);font-weight:700}
/* 正面建筑效果预览（底部居中，翻面效果提前可知） */
.card .ceffect{position:absolute;bottom:3px;left:2px;right:30px;text-align:center;font-size:7px;color:var(--gold-dim);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
/* 6 资源位（横版，符号图标，紧贴四边与文字区分离） */
.res-slot{position:absolute;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.35);box-shadow:inset 0 0 3px rgba(0,0,0,.2)}
.res-slot svg{width:11px;height:11px;color:#14100a}
.res-slot.tl{top:20px;left:3px}
.res-slot.tr{top:20px;right:3px}
.res-slot.bl{bottom:20px;left:3px}
.res-slot.br{bottom:20px;right:3px}
.res-slot.rm{top:58px;right:3px}
.res-slot.bm{bottom:20px;left:50%;transform:translateX(-50%)}
.res-slot.covered{opacity:.1;filter:grayscale(1)}
/* 中间订单/技能横条（与四边资源位保持间距） */
.card-mid{position:absolute;top:42px;left:4px;right:24px;height:38px;display:flex;gap:3px}
.card-order,.card-skill{flex:1;background:rgba(0,0,0,.25);border-radius:3px;padding:3px;overflow:hidden;font-size:8.5px;line-height:1.3}
.card-order{border-left:2px solid var(--C)}
.card-skill{border-left:2px solid var(--T)}
.card-order .lbl,.card-skill .lbl{font-size:7.5px;color:var(--text-dim);margin-bottom:1px;letter-spacing:.5px}
.card-order .req{display:flex;flex-wrap:wrap;gap:1px;align-items:center}
.card-order .req-r{display:flex;align-items:center;gap:1px;font-size:8px}
.card-order .req-ico{width:10px;height:10px}
/* 资源符号统一继承 currentColor 着色（订单图标显示资源色，资源位显示深色） */
.res-slot svg *, .req-ico *, .res-ico *, .gl-res-ico *{fill:currentColor}
.res-slot svg [fill="none"], .req-ico [fill="none"], .res-ico [fill="none"], .gl-res-ico [fill="none"]{fill:none}
.card-skill .sk-text{color:var(--text);font-size:8px}
.card-skill .sk-req{color:var(--text-dim);font-size:8px;display:flex;align-items:center;gap:3px;margin-top:2px}
.card-skill .sk-req .req-ico{width:12px;height:12px}
.card-skill .sk-type{display:inline-block;padding:0 3px;border-radius:2px;font-size:7px;font-weight:700;margin-bottom:1px}
/* 翻面建筑面 */
.card .build-face{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:10px;text-align:center}
.card.flipped .build-face{display:flex}
.card.flipped .cname,.card.flipped .clevel,.card.flipped .cscore,.card.flipped .res-slot,.card.flipped .card-mid{display:none}
.card .build-face .bname{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:3px}
.card .build-face .bscore{font-size:20px;font-weight:900;color:var(--gold);margin-bottom:2px}
.card .build-face .beffect{font-size:8.5px;color:var(--text-dim);line-height:1.3}

/* 堆叠（横版偏移） */
.stack-card{position:absolute}
.stack-res .stack-card{transform-origin:top left}
.stack-skill .stack-card{transform-origin:top left}

/* 手牌 */
.hand-zone{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px}
.hand-zone h3{font-size:12px;color:var(--gold);margin-bottom:8px;letter-spacing:1px}
.hand-cards{display:flex;gap:8px;flex-wrap:wrap;min-height:140px;align-items:flex-start}

/* 操作栏 */
.action-bar{display:flex;gap:8px;padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 16px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
.btn:hover:not(:disabled){background:var(--panel2);border-color:var(--gold-dim);color:var(--text-bright)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gold);color:#1a1208;border-color:var(--gold);font-weight:600}
.btn.primary:hover:not(:disabled){background:#e8bc52}
.btn.danger{border-color:#8a3a3a;color:#e07070}
.btn.danger:hover:not(:disabled){background:#2a1515}
.action-hint{font-size:11px;color:var(--text-dim);margin-left:auto}

/* 日志 */
.log-zone{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;max-height:120px;overflow-y:auto}
.log-zone h3{font-size:11px;color:var(--text-dim);margin-bottom:6px;letter-spacing:1px}
.log-line{font-size:11px;color:var(--text-dim);padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-line .p1{color:var(--K)}
.log-line .p2{color:var(--R)}
.log-line .gold{color:var(--gold)}

/* 调试面板 */
.debug-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;display:none}
.debug-panel.open{display:block}
.debug-panel h3{font-size:12px;color:var(--gold);margin-bottom:8px;cursor:pointer}
.debug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.debug-item{display:flex;align-items:center;gap:6px;font-size:11px}
.debug-item label{color:var(--text-dim);min-width:70px}
.debug-item input[type=range]{flex:1}
.debug-item val{color:var(--gold);font-weight:600;min-width:24px;text-align:right}
.debug-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* 弹层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.box{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:24px;max-width:480px;text-align:center}
.box h3{color:var(--gold);margin-bottom:12px;font-size:14px}
.box p{color:var(--text-dim);font-size:12px;margin-bottom:16px}
.box-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 终局 */
.endgame-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:200}
.endgame-overlay.show{display:flex}
.endgame-box{background:linear-gradient(160deg,#1a2440,#0d1424);border:2px solid var(--gold);border-radius:12px;padding:32px;text-align:center;max-width:500px}
.endgame-box h2{color:var(--gold);font-size:22px;margin-bottom:16px;letter-spacing:3px}
.endgame-scores{margin:16px 0}
.endgame-score-row{display:flex;justify-content:space-between;padding:8px 16px;font-size:14px;border-bottom:1px solid var(--border)}
.endgame-score-row.winner{color:var(--gold);font-weight:700}

/* 卡牌浏览器 */
.browser-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:150;overflow-y:auto;padding:20px}
.browser-overlay.show{display:block}
.browser-box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;max-width:1300px;margin:0 auto}
.browser-box h3{color:var(--gold);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.browser-filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.browser-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

@media(max-width:900px){
  .topbar h1{font-size:14px}
  .card{width:150px;height:106px}
  .card-mid{top:34px;height:32px}
  .res-slot{width:13px;height:13px}
  .res-slot svg{width:9px;height:9px}
  .res-slot.tl,.res-slot.tr{top:16px}
  .res-slot.bl,.res-slot.br,.res-slot.bm{bottom:16px}
  .res-slot.rm{top:46px}
}
@media(max-width:620px){
  #app{padding:6px}
  .topbar{gap:8px;padding:8px 10px}
  .topbar h1{font-size:13px;letter-spacing:1px}
  .stats{gap:10px}
  .stat{font-size:11px}
  .stat val{font-size:12px}
  .card{width:150px;height:106px}
  .card .cname{font-size:10px}
  .card .ceffect{font-size:7px;bottom:2px}
  .card-mid{top:30px;left:3px;right:20px;height:40px}
  .card-order .lbl,.card-skill .lbl{font-size:6.5px}
  .card-order .req-r{font-size:7px}
  .card-order .req-ico{width:8px;height:8px}
  .card-skill .sk-text{font-size:7px}
  .card-skill .sk-req{font-size:8px}
  .card-skill .sk-type{font-size:6px}
  .res-slot{width:13px;height:13px}
  .res-slot svg{width:9px;height:9px}
  .res-slot.tl,.res-slot.tr{top:16px}
  .res-slot.bl,.res-slot.br,.res-slot.bm{bottom:16px}
  .res-slot.rm{top:46px}
  .card .cscore,.card .clevel{font-size:9px}
  .group{min-width:0;width:100%}
  .group-row{gap:10px}
  /* 极小屏：手牌横向滚动，卡牌保持可读尺寸 */
  .hand-cards{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px}
  .action-bar{flex-wrap:wrap}
  .action-bar .btn{flex:1 1 44%;min-height:42px}
  .action-hint{width:100%}
  .build-face .bname{font-size:11px}
  /* 触控优化 */
  .player-tabs{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;padding-bottom:2px}
  .player-tab{flex:0 0 auto;min-height:38px;display:inline-flex;align-items:center}
  .group-skills .sk-row{min-height:42px;flex-wrap:wrap;padding:5px 0}
  .group-skills .sk-trigger{min-height:34px;padding:6px 14px;font-size:11px}
  .group-skills .sk-info{width:26px;height:26px;font-size:12px}
  .gl-grid{grid-template-columns:repeat(2,1fr)}
  .endgame-box{padding:20px 14px}
  .box{padding:18px 12px;max-width:94vw}
  .mcfg-lbl{min-width:44px;text-align:left}
  .mcfg-row{flex-wrap:wrap}
  #targetBtns .btn,#playBtns .btn{min-height:42px;padding:10px 14px}
  .btn{min-height:40px}
  .browser-overlay{padding:12px}
  .browser-box{padding:12px;max-width:100%}
  .browser-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .gl-item{font-size:12px;padding:8px}
  .hand-zone .hand-cards .card{flex:0 0 auto}
  .group-skills .sk-tag{font-size:10px;line-height:1.5}
}
/* 词条解释 */
.gl-sec{margin-bottom:14px}
.gl-sec-title{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:1px;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:3px}
.gl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gl-item{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:11px;line-height:1.5}
.gl-item.wide{grid-column:1/-1}
.gl-item em{color:var(--text-dim);font-style:normal;font-size:10px}
.gl-item b{color:var(--text-bright)}
.gl-hl{border-color:var(--gold);background:rgba(212,168,67,.12)}

/* AI 行动横幅 */
.ai-banner{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(212,168,67,.92);color:#1a1208;padding:8px 22px;border-radius:20px;font-weight:700;font-size:13px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.4);letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>密契工坊</h1>
    <div class="player-tabs" id="playerTabs"></div>
    <div class="stats">
      <div class="stat"><label>回合</label><val id="statTurn">1</val></div>
      <div class="stat"><label>行动点</label><div class="ap-dots" id="statAP"></div></div>
      <div class="stat"><label>得分</label><val id="statScore">0</val></div>
      <div class="stat"><label>牌堆</label><val id="statDeck">L1</val></div>
      <div class="stat"><label>牌库</label><val id="statDeckCnt">0</val></div>
    </div>
  </div>

  <div class="groups-zone">
    <h3>牌组区（资源以牌组为单位计算 · 每次打牌选择保留方式）<span class="cnt" id="groupCnt">0 组</span></h3>
    <div class="group-row" id="groupsArea"></div>
  </div>

  <div class="hand-zone">
    <h3>手牌（选中后：打出到牌组 / 建造翻面）</h3>
    <div class="hand-cards" id="handCards"></div>
  </div>

  <div class="action-bar">
    <button class="btn primary" id="btnDraw" onclick="actDraw()">抽卡 (1AP)</button>
    <button class="btn" id="btnPlay" onclick="openPlayOverlay()">打出到牌组 (1AP)</button>
    <button class="btn" id="btnSkill" onclick="actTriggerSkill()">触发技能 (1AP)</button>
    <button class="btn" id="btnBuild" onclick="actBuild()">建造翻面 (1AP)</button>
    <button class="btn danger" id="btnEndTurn" onclick="actEndTurn()">结束回合</button>
    <span class="action-hint" id="actionHint">点击卡牌选择；手牌可打出到牌组或建造</span>
  </div>

  <div class="log-zone">
    <h3>行动日志</h3>
    <div id="logLines"></div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn" onclick="toggleDebug()">调试面板</button>
    <button class="btn" onclick="openBrowser()">卡牌浏览器</button>
    <button class="btn primary" onclick="openGlossary()">词条解释</button>
    <button class="btn" onclick="showModeOverlay()">切换模式</button>
    <button class="btn danger" onclick="restart()">重开</button>
  </div>

  <div class="ai-banner" id="aiBanner" style="display:none">AI 正在行动…</div>

  <div class="debug-panel" id="debugPanel">
    <h3>调试与配置</h3>
    <div class="debug-grid">
      <div class="debug-item"><label>每回合AP</label><input type="range" id="cfgAP" min="1" max="4" value="2" oninput="updateCfg()"><val id="cfgAPVal">2</val></div>
      <div class="debug-item"><label>手牌上限</label><input type="range" id="cfgHand" min="5" max="10" value="7" oninput="updateCfg()"><val id="cfgHandVal">7</val></div>
      <div class="debug-item"><label>终局得分</label><input type="range" id="cfgEnd" min="20" max="60" value="40" oninput="updateCfg()"><val id="cfgEndVal">40</val></div>
    </div>
    <div class="debug-btns">
      <button class="btn" onclick="debugDraw()">抽1张</button>
      <button class="btn" onclick="debugAP()">+1AP</button>
      <button class="btn" onclick="debugScore()">+5分</button>
      <button class="btn" onclick="debugUnlock()">解锁下一级</button>
    </div>
  </div>
</div>

<!-- 打出牌组选择 -->
<div class="overlay" id="playOverlay">
  <div class="box">
    <h3 id="playTitle">打出卡牌到牌组</h3>
    <p id="playDesc"></p>
    <div class="box-btns" id="playBtns"></div>
  </div>
</div>

<!-- 目标选择 -->
<div class="overlay" id="targetOverlay">
  <div class="box">
    <h3 id="targetTitle">选择目标玩家</h3>
    <p id="targetDesc"></p>
    <div class="box-btns" id="targetBtns"></div>
  </div>
</div>

<!-- 终局 -->
<div class="endgame-overlay" id="endgameOverlay">
  <div class="endgame-box">
    <h2>仪式完成</h2>
    <div class="endgame-scores" id="endgameScores"></div>
    <button class="btn primary" onclick="restart()">再来一局</button>
  </div>
</div>

<!-- 模式选择（开屏：密教主视觉 · 多人 + 结束条件） -->
<div class="endgame-overlay" id="modeOverlay" style="display:none">
  <div class="mode-splash"></div>
  <div class="endgame-box" style="max-width:460px;background:rgba(10,15,28,.9);backdrop-filter:blur(3px)">
    <h2 style="font-size:26px;letter-spacing:6px;text-shadow:0 0 18px rgba(212,168,67,.45)">密契工坊</h2>
    <p style="color:var(--text-dim);font-size:12px;margin:6px 0 12px;line-height:1.6">禁忌炼金卡牌堆叠桌游 · 2~4 人 · 任意设备浏览器打开即可游玩</p>
    <div class="mcfg">
      <div class="mcfg-row"><span class="mcfg-lbl">玩家人数</span>
        <div class="seg" id="mCountSeg">
          <button class="seg-btn on" data-n="2" onclick="setCount(2)">2 人</button>
          <button class="seg-btn" data-n="3" onclick="setCount(3)">3 人</button>
          <button class="seg-btn" data-n="4" onclick="setCount(4)">4 人</button>
        </div>
      </div>
      <div class="mcfg-row"><span class="mcfg-lbl">玩家身份</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:5px" id="mPlayers"></div>
      </div>
      <div class="mcfg-row"><span class="mcfg-lbl">结束方式</span>
        <div class="seg" id="mEndSeg">
          <button class="seg-btn on" data-end="score" onclick="setEndMode('score')">目标分数</button>
          <button class="seg-btn" data-end="turns" onclick="setEndMode('turns')">固定回合</button>
          <button class="seg-btn" data-end="either" onclick="setEndMode('either')">先到先止</button>
        </div>
      </div>
      <div class="mcfg-row"><span class="mcfg-lbl">目标分数</span><input class="mcfg-in" id="mEndScore" type="number" value="40" min="5" max="200"></div>

// ========== 卡牌解析 ==========
let _uid = 0;
function parseCard(raw) {
  const [name, resStr, orderStr, skill, reqRes, score, buildEff] = raw.split("|");
  const pos = resStr.split(",");
  const resources = {};
  POSITIONS.forEach((p, i) => { resources[p] = pos[i] === "-" ? null : pos[i]; });
  const order = {};
  orderStr.split(",").forEach(pair => { const [r, n] = pair.split(":"); order[r] = parseInt(n); });
  const rawIdx = CARD_RAW.indexOf(raw);
  const level = rawIdx < 22 ? 1 : rawIdx < 40 ? 2 : rawIdx < 54 ? 3 : rawIdx < 69 ? 4 : 5;
  return { uid: ++_uid, name, resources, order, skill, reqRes, score: parseInt(score), buildEffect: buildEff === "-" ? null : buildEff, level, flipped: false };
}
const KIND = CARD_RAW.map(raw => { const c = parseCard(raw); c.kindId = c.name; return c; });

// ========== 游戏状态 ==========
let G = null;
let _viewIdx = null; // AI 模式下查看其他玩家（不切换操作者）
function newPlayer(idx) {
  return {
    idx, name: "玩家" + (idx + 1),
    hand: [], groups: [], buildings: [],
    score: 0, research: 1, ap: CFG.ap,
    eraAchieved: {},
    buffs: { resReveal: false, extraCover: [], buildDiscount: 0, doubleRes: null, buildTax: 0, buildBonus: 0, topCover: false },
    isAI: (CFG.playerTypes && CFG.playerTypes[idx] === "ai") || (CFG.mode === "ai" && idx === 1)
  };
}
function buildDecks() {
  // 等级分堆：5 叠牌库
  const decks = {1:[],2:[],3:[],4:[],5:[]};
  KIND.forEach(k => {
    const copies = k.level === 5 ? 1 : k.level === 4 ? 2 : 3;
    for (let copy = 0; copy < copies; copy++) {
      decks[k.level].push({ ...k, uid: ++_uid, flipped: false });
    }
  });
  for (let lv = 1; lv <= 5; lv++) {
    for (let i = decks[lv].length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [decks[lv][i], decks[lv][j]] = [decks[lv][j], decks[lv][i]];
    }
  }
  return decks;
}
function initGame() {
  _uid = 0;
  _viewIdx = null;
  G = {
    decks: buildDecks(), discard: [], players: [],
    currentPlayer: 0, turn: 1, selectedCard: null, pendingSkill: null, gameOver: false
  };
  for (let i = 0; i < CFG.playerCount; i++) {
    const p = newPlayer(i);
    for (let j = 0; j < 3; j++) drawCard(p, true);
    G.players.push(p);
  }
  const aiCount = CFG.playerTypes.filter(t => t === "ai").length;
  const endTxt = CFG.endMode === "turns" ? "结束：固定 " + CFG.maxTurns + " 回合" : CFG.endMode === "score" ? "结束：目标 " + CFG.endScore + " 分" : "结束：先到先止（" + CFG.maxTurns + " 回合 / " + CFG.endScore + " 分）";
  log("游戏开始：" + CFG.playerCount + " 人（" + aiCount + " 个 AI），" + endTxt + "；每 2 回合解锁下一级牌堆");
  render();
}
function startGame() {
  CFG.playerTypes = _cfg.types.slice();
  CFG.playerCount = _cfg.count;
  CFG.endMode = _cfg.endMode;
  CFG.endScore = Math.max(5, parseInt(document.getElementById("mEndScore").value) || 40);
  CFG.maxTurns = Math.max(3, parseInt(document.getElementById("mEndTurns").value) || 12);
  document.getElementById("modeOverlay").style.display = "none";
  document.getElementById("endgameOverlay").classList.remove("show");
  initGame();
}
function showModeOverlay() {
  renderModeCfg();
  document.getElementById("modeOverlay").style.display = "flex";
  document.getElementById("endgameOverlay").classList.remove("show");
}

// ========== 等级解锁 ==========
function getTurnUnlock(turn) {
  let max = 1;
  for (const [t, lv] of Object.entries(TURN_UNLOCK)) {
    if (turn >= parseInt(t)) max = Math.max(max, lv);
  }
  return max;
}
function getMaxLevel(player) {
  return Math.min(5, Math.max(getTurnUnlock(G.turn), player.research));
}

// ========== 可见资源计算（以牌组为单位） ==========
// 每张卡打出时选择遮盖方案：保留材料(res)=只遮左上；保留技能(skill)=遮左上+左下+下中
function coverFor(card, player) {
  if (card.cover === "skill") return COVER_SKILL.slice();
  let cov = COVER_RES.slice();
  if (player.buffs.resReveal || hasBuilding(player, "reveal")) cov = cov.filter(pos => pos !== "tl");
  return cov;
}
function getGroupVisible(group, player) {
  const vis = {};
  RES_ORDER.forEach(r => vis[r] = 0);
  group.cards.forEach((card, i) => {
    if (card.flipped) return;
    const isTop = (i === group.cards.length - 1);
    let covered = isTop ? (player.buffs.topCover ? ["mt","mr"] : []) : coverFor(card, player);
    if (!isTop) player.buffs.extraCover.forEach(pos => { if (!covered.includes(pos)) covered.push(pos); });
    POSITIONS.forEach(pos => {
      if (!covered.includes(pos) && card.resources[pos]) vis[card.resources[pos]]++;
    });
  });
  return vis;
}
function getVisibleResources(player) {
  const vis = {};
  RES_ORDER.forEach(r => vis[r] = 0);
  player.groups.forEach(group => {
    const gv = getGroupVisible(group, player);
    RES_ORDER.forEach(r => vis[r] += gv[r]);
  });
  return vis;
}
function hasBuilding(player, effect) { return player.buildings.some(b => b.buildEffect === effect); }
function getHandMax(player) { return CFG.handMax + (hasBuilding(player, "hand") ? 1 : 0); }
function getSkillAP(player) { return Math.max(1, 1 - (hasBuilding(player, "skillDiscount") ? 1 : 0)); }
// 技能判定：组内对应材料可见数（共鸣时该材料×2）
function groupResCount(group, player, res) {
  return getGroupVisible(group, player)[res] * (player.buffs.doubleRes === res ? 2 : 1);
}

// ========== 行动 ==========
function drawCard(player, silent) {
  // 从全部已解锁等级的非空牌堆中随机抽（解锁高级牌堆后仍可能抽到低级牌）
  const maxLv = getMaxLevel(player);
  const pools = [];
  for (let lv = 1; lv <= maxLv; lv++) if (G.decks[lv] && G.decks[lv].length > 0) pools.push(lv);
  if (pools.length === 0) {
    if (!silent) log("所有可用牌堆已空");
    return null;
  }
  const lv = pools[Math.floor(Math.random() * pools.length)];
  const card = G.decks[lv].pop();
  player.hand.push(card);
  if (!silent) log(player.name + " 从L" + lv + "牌堆抽到 " + card.name);
  return card;
}
function actDraw() {
  const p = G.players[G.currentPlayer];
  if (p.ap < 1) { log("行动点不足"); return; }
  const maxLv = getMaxLevel(p);
  let found = false;
  for (let lv = maxLv; lv >= 1; lv--) if (G.decks[lv] && G.decks[lv].length > 0) { found = true; break; }
  if (!found) { log("牌库已空"); return; }
  if (drawCard(p)) p.ap--;
  render();
}

// 打出卡牌：先选保留方式，再选目标牌组（加入已有牌组顶部或新开卡组）
let pendingCover = "res";
function openPlayOverlay() {
  const p = G.players[G.currentPlayer];
  if (!G.selectedCard) { log("请先选择手牌"); return; }
  if (p.ap < 1) { log("行动点不足"); return; }
  const card = p.hand.find(c => c.uid === G.selectedCard);
  if (!card) { log("手牌中找不到该卡"); return; }
  const overlay = document.getElementById("playOverlay");
  document.getElementById("playTitle").textContent = "打出：" + card.name + "（L" + card.level + "）";
  document.getElementById("playDesc").textContent = "选择保留方式（每次打牌单独决定，与牌组无关）：保留材料只遮左上、资源露得多；保留技能遮左上+左下+下中，可堆高触发技能。牌组数量无限制。";
  const btns = document.getElementById("playBtns");
  btns.innerHTML = "";
  const b1 = document.createElement("button");
  b1.className = "btn primary";
  b1.textContent = "保留材料（只遮左上）";
  b1.onclick = () => { pendingCover = "res"; showPlayTargets(card); };
  btns.appendChild(b1);
  const b2 = document.createElement("button");
  b2.className = "btn primary";
  b2.textContent = "保留技能（遮左上+左下+下中）";
  b2.onclick = () => { pendingCover = "skill"; showPlayTargets(card); };
  btns.appendChild(b2);
  const cancel = document.createElement("button");
  cancel.className = "btn";
  cancel.textContent = "取消";
  cancel.onclick = () => overlay.classList.remove("show");
  btns.appendChild(cancel);
  overlay.classList.add("show");
}
function showPlayTargets(card) {
  const p = G.players[G.currentPlayer];
  document.getElementById("playTitle").textContent = "打出：" + card.name + " → 选择牌组";
  document.getElementById("playDesc").textContent = "保留" + (pendingCover === "res" ? "材料（只遮左上）" : "技能（遮左上+左下+下中）") + "。新开牌组或加入已有牌组顶部。";
  const btns = document.getElementById("playBtns");
  btns.innerHTML = "";
  const b1 = document.createElement("button");
  b1.className = "btn primary";
  b1.textContent = "新建牌组";
  b1.onclick = () => playCard(pendingCover, "new");
  btns.appendChild(b1);
  p.groups.forEach((g, gi) => {
    if (g.cards.length >= 8) return;
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = "加入牌组 " + (gi + 1) + "（" + g.cards.length + "/8张）";
    b.onclick = () => playCard(pendingCover, "group-" + gi);
    btns.appendChild(b);
  });
  const back = document.createElement("button");
  back.className = "btn";
  back.textContent = "返回选择保留方式";
  back.onclick = () => openPlayOverlay();
  btns.appendChild(back);
  const cancel = document.createElement("button");
  cancel.className = "btn";
  cancel.textContent = "取消";
  cancel.onclick = () => document.getElementById("playOverlay").classList.remove("show");
  btns.appendChild(cancel);
}
function playCard(cover, target) {
  const p = G.players[G.currentPlayer];
  const overlay = document.getElementById("playOverlay");
  const card = p.hand.find(c => c.uid === G.selectedCard);
  if (!card) return;
  if (p.ap < 1) { log("行动点不足"); return; }
  p.ap--;
  p.hand.splice(p.hand.indexOf(card), 1);
  card.cover = cover;
  const coverName = cover === "res" ? "材料" : "技能";
  if (target === "new") {
    p.groups.push({ cards: [card] });
    log(p.name + " 新开牌组，以保留" + coverName + "放入 " + card.name);
  } else if (target.startsWith("group-")) {
    const gi = parseInt(target.slice(6));
    p.groups[gi].cards.push(card);
    log(p.name + " 将 " + card.name + "（保留" + coverName + "）加入牌组 " + (gi + 1) + " 顶部");
  }
  G.selectedCard = null;
  overlay.classList.remove("show");
  render();
}

// 卡在组内未被遮盖的资源位数量（技能发动条件：可见资源数 ≥ 卡等级）
function cardVisibleResCount(card, group, player) {
  const idx = group.cards.indexOf(card);
  const isTop = idx === group.cards.length - 1;
  let covered = isTop ? [] : coverFor(card, player);
  if (!isTop) player.buffs.extraCover.forEach(pos => { if (!covered.includes(pos)) covered.push(pos); });
  return POSITIONS.filter(pos => !covered.includes(pos) && card.resources[pos]).length;
}

function actTriggerSkill() {
  const p = G.players[G.currentPlayer];
  if (!G.selectedCard) { log("请先选择牌组中的卡"); return; }
  if (p.ap < getSkillAP(p)) { log("行动点不足"); return; }
  let group = null;
  p.groups.forEach(g => {
    const c = g.cards.find(c => c.uid === G.selectedCard);
    if (c) group = g;
  });
  if (!group) { log("请选择牌组中的卡"); return; }
  const main = group.cards.find(c => c.uid === G.selectedCard);
  // 主技能卡需满足：组内「对应材料」可见数 ≥ 卡等级
  const mainVis = groupResCount(group, p, main.reqRes);
  if (mainVis < main.level) { log(main.name + " 需组内" + RES_DEF[main.reqRes].name + "×" + main.level + "，当前 " + mainVis + "，无法发动技能"); return; }
  // 玩家触发且组内有可用的互动技能 → 先选择目标玩家；AI 自动选择分数最高的对手
  const hasInteractive = group.cards.some(c => c.skill && SKILL_DEF[c.skill] && SKILL_DEF[c.skill].interactive && groupResCount(group, p, c.reqRes) >= c.level);
  if (!p.isAI && hasInteractive) {
    G.pendingSkill = { card: main };
    showTargetOverlay(main, main.level);
    return;
  }
  p.ap -= getSkillAP(p);
  doTriggerChain(p, group, main, p.isAI ? aiPickTarget(p) : null);
}
// 连锁触发：组内所有技能卡免费一并触发（各自满足对应材料≥等级才结算）；强度 N=各卡等级
function doTriggerChain(p, group, main, targetIdx) {
  const chain = group.cards.filter(c => c.skill && SKILL_DEF[c.skill]);
  const names = [], skipped = [];
  chain.forEach(c => {
    const sd = SKILL_DEF[c.skill];
    const visCnt = groupResCount(group, p, c.reqRes);
    if (visCnt < c.level) { skipped.push(c.name + "(L" + c.level + ")需" + RES_DEF[c.reqRes].name + "×" + c.level + "，当前" + visCnt); return; }
    const N = c.level; // 技能强度按卡牌等级（L1~L5）
    resolveSkill(p, c, N, sd.interactive ? targetIdx : null);
    names.push(c.name + "(" + c.skill + " L" + c.level + ")");
  });
  log(p.name + " 触发 " + main.name + "（1AP），连锁免费触发组内技能：" + (names.join("、") || "无") + (skipped.length ? "；未满足对应材料跳过：" + skipped.join("、") : ""));
  G.selectedCard = null;
  checkEndgame();
  render();
}
// AI 选择互动技能目标：分数最高的对手（压制领先者）
function aiPickTarget(p) {
  const others = G.players.filter(q => q !== p);
  if (others.length === 0) return null;
  const t = others.slice().sort((a, b) => b.score - a.score)[0];
  return G.players.indexOf(t);
}

function resolveSkill(player, card, N, targetIdx) {
  const p = player;
  switch (card.skill) {
    case "D": for (let i = 0; i < N; i++) drawCard(p); log(p.name + " 触发" + card.name + "：抽" + N + "张"); break;
    case "S": p.score += N; log(p.name + " 触发" + card.name + "：+" + N + "分"); checkEndgame(); break;
    case "R": p.buffs.resReveal = true; log(p.name + " 触发" + card.name + "：本回合保留材料的卡露出左上"); break;
    case "B": p.buffs.buildDiscount = Math.max(p.buffs.buildDiscount, N); log(p.name + " 触发" + card.name + "：下次建造需求-" + N + "（每项最低需1份材料）"); break;
    case "I":
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        const discarded = Math.min(N, t.hand.length);
        for (let i = 0; i < discarded; i++) G.discard.push(t.hand.pop());
        log(p.name + " 干扰 " + t.name + "：弃" + discarded + "张手牌");
      }
      break;
    case "C":
      for (let i = 0; i < N; i++) drawCard(p);
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        const give = Math.ceil(N / 2);
        for (let i = 0; i < give; i++) drawCard(t);
        log(p.name + " 合作：自己抽" + N + "张，" + t.name + "抽" + give + "张");
      }
      break;
    case "H":
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        if (!t.buffs.extraCover.includes("tr")) t.buffs.extraCover.push("tr");
        log(p.name + " 遮盖干扰 " + t.name + "：其牌组本回合额外遮盖右上");
      }
      break;
    case "X":
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        let stolen = null;
        for (let g = t.groups.length - 1; g >= 0 && !stolen; g--) {
          for (let i = t.groups[g].cards.length - 1; i >= 0; i--) {
            if (!t.groups[g].cards[i].flipped) {
              stolen = t.groups[g].cards.splice(i, 1)[0];
              break;
            }
          }
        }
        if (stolen) {
          p.groups.push({ cards: [stolen] });
          log(p.name + " 偷取 " + t.name + " 的 " + stolen.name + "，放入自己的新牌组");
        } else log("目标无正面卡可偷");
      }
      break;
    case "J":
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        t.buffs.topCover = true;
        log(p.name + " 封印 " + t.name + "：其所有牌组顶卡本回合额外遮盖中上+中右");
      }
      break;
    case "K": p.buffs.doubleRes = card.reqRes; log(p.name + " 共鸣：本回合" + RES_DEF[card.reqRes].name + "计数×2"); break;
    case "O": { let got = 0; for (let i = 0; i < N && G.discard.length > 0; i++) { p.hand.push(G.discard.pop()); got++; } log(p.name + " 复苏：从弃牌堆取回" + got + "张卡"); break; }
    case "M":
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        let dropped = 0;
        t.groups.forEach(g => {
          for (let i = g.cards.length - 1; i >= 0; i--) {
            if (!g.cards[i].flipped) { G.discard.push(g.cards.splice(i, 1)[0]); dropped++; break; }
          }
        });
        log(p.name + " 湮灭 " + t.name + "：弃其" + dropped + "张牌组顶卡");
      }
      break;
    case "G": p.buffs.buildBonus = Math.max(p.buffs.buildBonus || 0, N); log(p.name + " 颂歌：下次建造额外 +" + N + "分"); break;
    case "E":
      if (targetIdx != null) {
        const t = G.players[targetIdx];
        t.buffs.buildTax = Math.max(t.buffs.buildTax || 0, N);
        log(p.name + " 注视 " + t.name + "：其本回合建造需求每项 +" + N);
      }
      break;
  }
}

function actBuild() {
  const p = G.players[G.currentPlayer];
  if (!G.selectedCard) { log("请先选择手牌"); return; }
  if (p.ap < 1) { log("行动点不足"); return; }
  const idx = p.hand.findIndex(c => c.uid === G.selectedCard);
  if (idx < 0) return;
  const card = p.hand[idx];
  if (card.level > getMaxLevel(p)) { log("牌堆未解锁（当前最高L" + getMaxLevel(p) + "，需要L" + card.level + "）"); return; }
  const vis = getVisibleResources(p);
  const discount = p.buffs.buildDiscount || 0;
  const tax = p.buffs.buildTax || 0;
  for (const [res, amt] of Object.entries(card.order)) {
    const raw = Math.max(0, amt - discount + tax);
    const need = amt > 0 ? Math.max(1, raw) : 0; // 折扣不能完全免除材料，每项至少需1份
    let have = vis[res];
    if (p.buffs.doubleRes === res) have *= 2; // 共鸣：对应材料计数×2
    if (have < need) { log("资源不足：需要 " + need + " " + RES_DEF[res].name + "，当前 " + have); return; }
  }
  if (discount > 0) log("建造折扣生效：各项需求 -" + discount + "（每项最低需1份材料）");
  if (tax > 0) log("注视干扰生效：各项需求 +" + tax);
  p.hand.splice(idx, 1);
  card.flipped = true;
  p.buildings.push(card);
  p.ap--;
  G.selectedCard = null;
  let gained = card.score;
  if (p.buffs.buildBonus) { gained += p.buffs.buildBonus; log("颂歌加成 +" + p.buffs.buildBonus + "分"); }
  if (card.buildEffect === "score") gained += 2;
  if (!p.eraAchieved[card.level]) { p.eraAchieved[card.level] = true; gained += 2; log("时代成就 L" + card.level + " +2分"); }
  p.score += gained;
  if (card.buildEffect === "unlock" && p.research < 5) {
    p.research = Math.min(5, p.research + 1);
    log("建筑效果：解锁牌堆，最高可用L" + p.research);
  }
  p.buffs.buildDiscount = 0;
  p.buffs.buildBonus = 0;
  p.buffs.buildTax = 0;
  log(p.name + " 建造 " + card.name + "（L" + card.level + "）+" + gained + "分");
  checkEndgame();
  render();
}

function actEndTurn() {
  const p = G.players[G.currentPlayer];
  const handMax = getHandMax(p);
  while (p.hand.length > handMax) G.discard.push(p.hand.pop());
  p.buffs.resReveal = false;
  p.buffs.extraCover = [];
  p.buffs.doubleRes = null;
  p.buffs.buildBonus = 0;
  p.buffs.buildTax = 0;
  p.buffs.topCover = false;
  log(p.name + " 结束回合");
  G.currentPlayer = (G.currentPlayer + 1) % G.players.length;
  if (G.currentPlayer === 0) G.turn++;
  if (!G.gameOver && CFG.endMode !== "score" && G.turn > CFG.maxTurns) {
    G.gameOver = true;
    log("已达 " + CFG.maxTurns + " 回合，仪式完成");
    setTimeout(showEndgame, 400);
  }
  const np = G.players[G.currentPlayer];
  np.buffs.resReveal = false;
  np.buffs.extraCover = [];
  np.buffs.doubleRes = null;
  np.buffs.buildBonus = 0;
  np.buffs.buildTax = 0;
  np.buffs.topCover = false;
  np.ap = CFG.ap;
  const drawBuildings = np.buildings.filter(b => b.buildEffect === "draw").length;
  for (let i = 0; i < drawBuildings; i++) drawCard(np);
  G.selectedCard = null;
  log("=== 回合 " + G.turn + "：" + np.name + "（可用牌堆L1-L" + getMaxLevel(np) + "）===");
  render();
  if (np.isAI && !G.gameOver) aiTurn();
}
function checkEndgame() {
  if (G.gameOver) return;
  const p = G.players[G.currentPlayer];
  if (CFG.endMode !== "turns" && p.score >= CFG.endScore) {
    G.gameOver = true;
    log(p.name + " 达到 " + CFG.endScore + " 分，仪式完成");
    setTimeout(showEndgame, 300);
  }
}

// ========== AI（人机对战） ==========
function aiTurn() {
  const p = G.players[G.currentPlayer];
  if (!p.isAI || G.gameOver) return;
  _viewIdx = null;
  G.selectedCard = null;
  render();
  setTimeout(aiStep, 900);
}
let _aiSteps = 0;
function aiStep() {
  const p = G.players[G.currentPlayer];
  if (!p.isAI || G.gameOver) { render(); return; }
  if (p.ap <= 0) { actEndTurn(); return; }
  if (_aiSteps++ > 40) { log("AI 行动异常中断"); p.ap = 0; render(); return; }
  const action = aiChooseAction(p);
  if (!action) { p.ap = 0; render(); setTimeout(aiStep, 500); return; }
  setTimeout(() => {
    try { aiDoAction(p, action); } catch (e) { log("AI 行动失败：" + e.message); p.ap = 0; }
    setTimeout(aiStep, 650);
  }, 650);
}
function aiCanAfford(p, card) {
  if (card.level > getMaxLevel(p)) return false;
  const vis = getVisibleResources(p);
  const disc = p.buffs.buildDiscount || 0;
  for (const [r, amt] of Object.entries(card.order)) {
    const raw = Math.max(0, amt - disc);
    const need = amt > 0 ? Math.max(1, raw) : 0;
    if (vis[r] < need) return false;
  }
  return true;
}
function aiChooseAction(p) {
  // 1. 建造：满足订单的最高价值卡（unlock > score > 其他）
  let best = null, bestW = -1;
  p.hand.forEach(c => {
    if (!aiCanAfford(p, c)) return;
    let w = c.buildEffect === "unlock" ? 5 : c.buildEffect === "score" ? 3 : 1;
    w += c.score;
    if (w > bestW) { bestW = w; best = c; }
  });
  if (best) return { t: "build", card: best };
  // 2. 技能：技能卡可见资源数≥等级，按卡牌等级评估收益
  for (let gi = 0; gi < p.groups.length; gi++) {
    const g = p.groups[gi];
    for (const c of g.cards) {
      if (groupResCount(g, p, c.reqRes) < c.level) continue;
      if (c.skill === "S" && c.level >= 2) return { t: "skill", card: c, gi };
      if (c.skill === "D" && p.hand.length < getHandMax(p) - 1) return { t: "skill", card: c, gi };
      if (c.skill === "R" && !p.buffs.resReveal && c.level >= 2) return { t: "skill", card: c, gi };
      if (c.skill === "C" && c.level >= 2) return { t: "skill", card: c, gi };
      if (c.skill === "K" && !p.buffs.doubleRes) return { t: "skill", card: c, gi };
      if (c.skill === "G" && !p.buffs.buildBonus) return { t: "skill", card: c, gi };
      if (c.skill === "I" && c.level >= 3) return { t: "skill", card: c, gi };
      if (c.skill === "H" && c.level >= 3) return { t: "skill", card: c, gi };
      if (c.skill === "X" && c.level >= 3) return { t: "skill", card: c, gi };
    }
  }
  // 3. 打出/抽卡平衡：无牌组先建组积累资源；手牌偏少抽卡；手牌过多堆牌组
  if (p.groups.length === 0 && p.hand.length > 0) {
    const card = p.hand[p.hand.length - 1];
    return { t: "play", card };
  }
  if (p.hand.length < getHandMax(p) - 2) return { t: "draw" };
  if (p.hand.length > 0) {
    const card = p.hand[p.hand.length - 1];
    return { t: "play", card };
  }
  return null;
}
function aiDoAction(p, action) {
  if (action.t === "build") {
    G.selectedCard = action.card.uid;
    actBuild();
  } else if (action.t === "skill") {
    G.selectedCard = action.card.uid;
    actTriggerSkill(); // 统一连锁：1AP 触发组内全部技能
  } else if (action.t === "draw") {
    actDraw();
  } else if (action.t === "play") {
    G.selectedCard = action.card.uid;
    // 目标：加入最满（<8）的组；无则新建。保留方式：手牌存在待建卡且本卡资源丰富→材料，否则偏向技能
    let gi = -1, bestN = -1;
    p.groups.forEach((g, i) => { if (g.cards.length < 8 && g.cards.length > bestN) { bestN = g.cards.length; gi = i; } });
    const resCount = Object.values(action.card.resources).filter(Boolean).length;
    const hasBuildable = p.hand.some(c => aiCanAfford(p, c));
    const cover = (resCount >= 4 && !hasBuildable) || (resCount >= 4 && gi < 0) ? "res" : (Math.random() < 0.5 ? "res" : "skill");
    if (gi >= 0) playCard(cover, "group-" + gi);
    else playCard(cover, "new");
  }
}

// ========== 目标选择 ==========
function showTargetOverlay(card, N) {
  const sd = SKILL_DEF[card.skill];
  document.getElementById("targetTitle").textContent = sd.name + "（N=" + N + "）";
  document.getElementById("targetDesc").textContent = sd.desc;
  const btns = document.getElementById("targetBtns");
  btns.innerHTML = "";
  G.players.forEach((pl, i) => {
    if (i === G.currentPlayer) return;
    const btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = pl.name + "（" + pl.hand.length + "手牌）";
    btn.onclick = () => selectTarget(i);
    btns.appendChild(btn);
  });
  const cancel = document.createElement("button");
  cancel.className = "btn";
  cancel.textContent = "取消";
  cancel.onclick = () => { G.pendingSkill = null; document.getElementById("targetOverlay").classList.remove("show"); };
  btns.appendChild(cancel);
  document.getElementById("targetOverlay").classList.add("show");
}
function selectTarget(targetIdx) {
  const p = G.players[G.currentPlayer];
  const { card } = G.pendingSkill;
  let group = null;
  p.groups.forEach(g => { const c = g.cards.find(c => c.uid === card.uid); if (c) group = g; });
  G.pendingSkill = null;
  document.getElementById("targetOverlay").classList.remove("show");
  if (!group) return;
  p.ap -= getSkillAP(p);
  doTriggerChain(p, group, card, targetIdx);
}

// ========== 终局 ==========
function showEndgame() {
  const why = CFG.endMode === "turns" ? "固定回合结束 · " + CFG.maxTurns + " 回合" : CFG.endMode === "score" ? "目标分数达成 · " + CFG.endScore + " 分" : "先到先止 · " + CFG.maxTurns + " 回合 / " + CFG.endScore + " 分";
  const tt = document.querySelector("#endgameOverlay h2");
  if (tt) tt.textContent = "仪式完成（" + why + "）";
  const box = document.getElementById("endgameScores");
  box.innerHTML = "";
  const sorted = G.players.slice().sort((a, b) => b.score - a.score);
  sorted.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "endgame-score-row" + (i === 0 ? " winner" : "");
    row.innerHTML = "<span>" + p.name + (i === 0 ? " ★ 胜利" : "") + "</span><span>" + p.score + "分</span>";
    box.appendChild(row);
  });
  document.getElementById("endgameOverlay").classList.add("show");
}

// ========== 渲染 ==========
function render() {
  if (!G) return;
  const cur = G.players[G.currentPlayer];
  const p = G.players[_viewIdx != null ? _viewIdx : G.currentPlayer];
  const viewingOther = _viewIdx != null && _viewIdx !== G.currentPlayer;
  const canOperate = !cur.isAI && !viewingOther && !G.gameOver;
  document.getElementById("aiBanner").style.display = cur.isAI ? "block" : "none";
  document.getElementById("statTurn").textContent = G.turn;
  document.getElementById("statScore").textContent = p.score;
  const maxLv = getMaxLevel(p);
  document.getElementById("statDeck").textContent = "L1-L" + maxLv;
  let totalCards = 0;
  for (let lv = 1; lv <= maxLv; lv++) totalCards += (G.decks[lv] || []).length;
  document.getElementById("statDeckCnt").textContent = totalCards;
  const apDots = document.getElementById("statAP");
  apDots.innerHTML = "";
  for (let i = 0; i < CFG.ap; i++) {
    const d = document.createElement("div");
    d.className = "ap-dot" + (i < p.ap ? " on" : "");
    apDots.appendChild(d);
  }
  const tabs = document.getElementById("playerTabs");
  tabs.innerHTML = "";
  G.players.forEach((pl, i) => {
    const t = document.createElement("div");
    t.className = "player-tab" + ((_viewIdx != null ? _viewIdx : G.currentPlayer) === i ? " active" : "");
    t.textContent = pl.name + " " + pl.score + "分" + (pl.isAI ? " (AI)" : "");
    t.onclick = () => {
      if (CFG.mode === "ai") {
        _viewIdx = (_viewIdx === i ? null : i);
      } else {
        G.currentPlayer = i;
      }
      G.selectedCard = null;
      render();
    };
    tabs.appendChild(t);
  });
  document.getElementById("groupCnt").textContent = p.groups.length + " 组";
  const ga = document.getElementById("groupsArea");
  ga.innerHTML = "";
  if (p.groups.length === 0) ga.innerHTML = '<div style="color:var(--text-dim);font-size:11px;padding:10px">（尚无牌组，选中手牌后点"打出到牌组"新开牌组）</div>';
  p.groups.forEach((g, gi) => {
    const groupEl = document.createElement("div");
    groupEl.className = "group";
    groupEl.innerHTML = '<div class="group-head"><span class="group-type">牌组' + (gi + 1) + '</span><span class="group-cnt">' + g.cards.length + '/8张</span></div><div class="stack-area"></div>';
    renderStack(groupEl.querySelector(".stack-area"), g, p);
    // 该牌组的资源统计（跟随牌组显示）
    const gv = getGroupVisible(g, p);
    const resBlock = document.createElement("div");
    resBlock.className = "group-res";
    resBlock.innerHTML = '<div class="grp-tag">本组资源</div>';
    RES_ORDER.forEach(r => {
      const row = document.createElement("div");
      row.className = "grp-row";
      row.innerHTML = '<svg class="res-ico" viewBox="0 0 16 16" style="color:' + RES_DEF[r].color + '" aria-hidden="true">' + RES_ICO[r] + '</svg><span class="res-name">' + RES_DEF[r].name + '</span><val>' + gv[r] + '</val>';
      resBlock.appendChild(row);
    });
    groupEl.appendChild(resBlock);
    // 组技能栏：列出组内技能，显示技能等级并标注可用/不可用（发动条件：AP + 1电力 + 可见资源≥等级）
    const skMap = {};
    g.cards.forEach(c => { if (c.skill && SKILL_DEF[c.skill] && (!skMap[c.skill] || c.level > skMap[c.skill].best.level)) skMap[c.skill] = { sd: SKILL_DEF[c.skill], best: c }; });
    if (Object.keys(skMap).length > 0) {
      const skBlock = document.createElement("div");
      skBlock.className = "group-skills";
      skBlock.innerHTML = '<div class="sk-tag">组技能（1AP连锁触发 · N=卡牌等级 · 需组内对应材料≥等级）</div>';
      Object.keys(skMap).forEach(key => {
        const { sd, best } = skMap[key];
        const needRes = best.reqRes;
        const haveRes = groupResCount(g, p, needRes);
        let skStateCls = "view", skStateTxt = "查看中";
        if (canOperate) {
          if (p.ap < getSkillAP(p)) { skStateCls = "no"; skStateTxt = "AP不足"; }
          else if (haveRes < best.level) { skStateCls = "no"; skStateTxt = "材料不足"; }
          else { skStateCls = "ok"; skStateTxt = "可用"; }
        }
        const row = document.createElement("div");
        row.className = "sk-row " + skStateCls;
        const canTrig = (canOperate && skStateCls === "ok");
        row.innerHTML = '<span class="sk-letter" style="background:' + sd.color + '">' + key + '</span>' + sd.name + '<span class="sk-lv">L' + best.level + '</span><span class="sk-req">需' + best.level + '<svg class="req-ico" viewBox="0 0 16 16" style="color:' + RES_DEF[needRes].color + '" aria-hidden="true">' + RES_ICO[needRes] + '</svg></span><span class="sk-state">' + skStateTxt + '</span><button class="sk-info" title="查看技能说明">?</button>' + (canTrig ? '<button class="sk-trigger" title="发动技能（1AP，连锁触发组内全部技能）">发动</button>' : '');
        row.title = sd.name + "：" + sd.desc + (sd.interactive ? "（需选择目标玩家）" : "") + "；N=卡牌等级；发动需组内对应材料" + RES_DEF[needRes].name + "≥L" + best.level + "（当前" + haveRes + "）";
        row.onclick = () => openGlossary(key);
        const tb = row.querySelector(".sk-trigger");
        if (tb) tb.onclick = (e) => { e.stopPropagation(); G.selectedCard = best.uid; actTriggerSkill(); };
        const ib = row.querySelector(".sk-info");
        if (ib) ib.onclick = (e) => { e.stopPropagation(); openGlossary(key); };
        skBlock.appendChild(row);
      });
      groupEl.appendChild(skBlock);
    }
    ga.appendChild(groupEl);
  });
  const ba = document.getElementById("buildArea") || createBuildArea();
  if (ba) {
    ba.innerHTML = '<div style="width:100%;font-size:12px;color:var(--gold);margin-bottom:6px;letter-spacing:1px">建筑区（建造翻面，持续效果激活）</div>';
    p.buildings.forEach(c => ba.appendChild(createCardEl(c, {})));
  }
  const hc = document.getElementById("handCards");
  hc.innerHTML = "";
  p.hand.forEach(c => hc.appendChild(createCardEl(c, { selected: G.selectedCard === c.uid })));
  const inHand = !!p.hand.find(c => c.uid === G.selectedCard);
  const inGroup = p.groups.some(g => g.cards.find(c => c.uid === G.selectedCard));
  document.getElementById("btnDraw").disabled = !canOperate || p.ap < 1;
  document.getElementById("btnPlay").disabled = !canOperate || p.ap < 1 || !inHand;
  document.getElementById("btnBuild").disabled = !canOperate || p.ap < 1 || !inHand;
  document.getElementById("btnSkill").disabled = !canOperate || p.ap < getSkillAP(p) || !inGroup;
  document.getElementById("btnEndTurn").disabled = !canOperate;
  const hint = document.getElementById("actionHint");
  if (cur.isAI) { hint.textContent = "AI 正在行动，请稍候…"; }
  else if (viewingOther) { hint.textContent = "正在查看 " + p.name + " 的版面（点击自己的名字回到操作）"; }
  else if (G.selectedCard) {
    if (inHand) { const c = p.hand.find(c => c.uid === G.selectedCard); hint.textContent = "已选手牌：" + c.name + "（可打出到牌组或建造）"; }
    else if (inGroup) {
      const g = p.groups.find(g => g.cards.find(c => c.uid === G.selectedCard));
      const c = g.cards.find(c => c.uid === G.selectedCard);
      hint.textContent = "已选牌组卡：" + c.name + "（牌组 " + (p.groups.indexOf(g) + 1) + "，N=" + g.cards.length + "，可触发技能）";
    }
  } else { hint.textContent = "点击卡牌选择；手牌可打出到牌组或建造"; }
}
function createBuildArea() {
  const zone = document.createElement("div");
  zone.id = "buildArea";
  zone.style.cssText = "background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;min-height:120px";
  zone.innerHTML = '<div style="width:100%;font-size:12px;color:var(--gold);margin-bottom:6px;letter-spacing:1px">建筑区（建造翻面，持续效果激活）</div>';
  const app = document.getElementById("app");
  const handZone = app.querySelector(".hand-zone");
  app.insertBefore(zone, handZone);
  return zone;
}
function renderStack(container, group, player) {
  container.innerHTML = "";
  if (group.cards.length === 0) return;
  const n = group.cards.length;
  group.cards.forEach((card, i) => {
    const isTop = (i === n - 1);
    let covered = isTop ? [] : coverFor(card, player);
    if (!isTop) player.buffs.extraCover.forEach(pos => { if (!covered.includes(pos)) covered.push(pos); });
    const wrap = document.createElement("div");
    wrap.className = "stack-card";
    const x = (n - 1 - i) * 18;
    const y = (n - 1 - i) * 10;
    wrap.style.transform = "translate(" + x + "px," + y + "px)";
    wrap.style.zIndex = i;
    wrap.appendChild(createCardEl(card, { covered, selected: G.selectedCard === card.uid }));
    if (!isTop) {
      const ind = document.createElement("span");
      ind.className = "cover-ind " + (card.cover === "skill" ? "skill" : "res");
      ind.title = "该卡保留" + (card.cover === "skill" ? "技能" : "材料") + "（被遮盖：左上" + (card.cover === "skill" ? "、左下、下中" : "") + "）";
      wrap.appendChild(ind);
    }
    container.appendChild(wrap);
  });
  container.style.minWidth = (185 + (n - 1) * 18) + "px";
  container.style.minHeight = (130 + (n - 1) * 10) + "px";
}
function createCardEl(card, opts) {
  const el = document.createElement("div");
  el.className = "card" + (card.flipped ? " flipped" : "") + (opts.selected ? " selected" : "");
  el.onclick = () => { G.selectedCard = G.selectedCard === card.uid ? null : card.uid; render(); };
  if (card.flipped) {
    el.innerHTML = '<div class="build-face"><div class="bname">' + card.name + '</div><div class="bscore">+' + card.score + '</div><div class="beffect">' + (BUILD_EFFECT[card.buildEffect]?.desc || "") + '</div></div>';
    return el;
  }
  let html = '<div class="cname">' + card.name + '</div>';
  html += '<div class="clevel">L' + card.level + '</div>';
  html += '<div class="cscore">+' + card.score + '</div>';
  if (card.buildEffect && BUILD_EFFECT[card.buildEffect]) {
    const be = BUILD_EFFECT[card.buildEffect];
    html += '<div class="ceffect" title="建造翻面后：' + be.desc + '">建→' + be.name + '</div>';
  }
  const covered = opts.covered || [];
  POSITIONS.forEach(pos => {
    const r = card.resources[pos];
    if (r) {
      const isCov = covered.includes(pos);
      html += '<div class="res-slot ' + pos + (isCov ? ' covered' : '') + '" style="background:' + RES_DEF[r].color + '" title="' + POS_NAMES[pos] + ' ' + RES_DEF[r].name + (isCov ? '（被遮盖）' : '') + '">' + resIcon(r, "slot-ico") + '</div>';
    }
  });
  const sd = SKILL_DEF[card.skill];
  let orderHtml = "";
  for (const [r, amt] of Object.entries(card.order)) {
    orderHtml += '<span class="req-r"><svg class="req-ico" viewBox="0 0 16 16" style="color:' + RES_DEF[r].color + '" aria-hidden="true">' + RES_ICO[r] + '</svg>' + amt + '</span>';
  }
  html += '<div class="card-mid">';
  html += '<div class="card-order"><div class="lbl">订单</div><div class="req">' + orderHtml + '</div></div>';
  html += '<div class="card-skill"><span class="sk-type" style="background:' + sd.color + ';color:#1a1208">' + card.skill + '</span><div class="sk-text">' + sd.name + '</div><div class="sk-req">需' + card.level + '<svg class="req-ico" viewBox="0 0 16 16" style="color:' + RES_DEF[card.reqRes].color + '" aria-hidden="true">' + RES_ICO[card.reqRes] + '</svg></div></div>';
  html += '</div>';
  el.innerHTML = html;
  return el;
}

// ========== 日志 ==========
function log(msg) {
  const lines = document.getElementById("logLines");
  const line = document.createElement("div");
  line.className = "log-line";
  line.textContent = msg;
  lines.appendChild(line);
  lines.scrollTop = lines.scrollHeight;
  while (lines.children.length > 50) lines.removeChild(lines.firstChild);
}

// ========== 调试 ==========
function toggleDebug() { document.getElementById("debugPanel").classList.toggle("open"); }
function updateCfg() {
  CFG.ap = parseInt(document.getElementById("cfgAP").value);
  CFG.handMax = parseInt(document.getElementById("cfgHand").value);
  CFG.endScore = parseInt(document.getElementById("cfgEnd").value);
  document.getElementById("cfgAPVal").textContent = CFG.ap;
  document.getElementById("cfgHandVal").textContent = CFG.handMax;
  document.getElementById("cfgEndVal").textContent = CFG.endScore;
  if (G) { G.players.forEach(p => { if (p.ap > CFG.ap) p.ap = CFG.ap; }); render(); }
}
function debugDraw() { const p = G.players[G.currentPlayer]; drawCard(p); render(); }
function debugAP() { const p = G.players[G.currentPlayer]; p.ap = Math.min(CFG.ap, p.ap + 1); render(); }
function debugScore() { const p = G.players[G.currentPlayer]; p.score += 5; checkEndgame(); render(); }
function debugUnlock() { const p = G.players[G.currentPlayer]; p.research = Math.min(5, p.research + 1); log("调试：解锁至L" + p.research); render(); }

// ========== 卡牌浏览器 ==========
let browserFilter = "all";
function openBrowser() { document.getElementById("browserOverlay").classList.add("show"); renderBrowser(); }
function closeBrowser() { document.getElementById("browserOverlay").classList.remove("show"); }
function renderBrowser() {
  const filters = document.getElementById("browserFilters");
  filters.innerHTML = "";
  ["all",1,2,3,4,5].forEach(lv => {
    const b = document.createElement("button");
    b.className = "btn" + (browserFilter === lv ? " primary" : "");
    b.textContent = lv === "all" ? "全部" : "L" + lv;
    b.style.fontSize = "11px"; b.style.padding = "4px 10px";
    b.onclick = () => { browserFilter = lv; renderBrowser(); };
    filters.appendChild(b);
  });
  const grid = document.getElementById("browserGrid");
  grid.innerHTML = "";
  KIND.forEach(k => {
    if (browserFilter !== "all" && k.level !== browserFilter) return;
    grid.appendChild(createCardEl(k, {}));
  });
}

// ========== 词条解释 ==========
const RULE_TERMS = [
  {t:"保留方式", d:"每次打牌时选择：保留材料=非顶卡只遮左上（资源露得多）；保留技能=非顶卡遮左上+左下+下中（可堆高触发技能）。与牌组无关，同一牌组可混合。"},
  {t:"资源以牌组为单位", d:"卡牌正面未被遮盖的资源图标即为你拥有的资源。资源统计按每个牌组分别展示；建造时检查全部牌组的可见资源之和（资源是门槛，不消耗）。"},
  {t:"牌组堆叠", d:"打出卡牌时放在牌组最上方或新开牌组。牌组数量无限制，每组最多8张。非顶卡会被遮盖部分资源位；顶卡始终完全可见。"},
  {t:"技能强度 N", d:"发动技能需消耗1行动点，且该技能卡所在牌组内其「对应材料」的可见数量 ≥ 卡牌等级（如 L3 共祈需组内有 3 个银）。对应材料标注在卡面技能区与组技能栏。触发时 N=该技能卡的等级，与牌组大小无关。每回合2行动点。"},
  {t:"技能连锁", d:"触发组内任意一张卡的技能（消耗1AP）时，该组内所有技能卡免费一并触发（连锁），每张卡按各自等级结算强度；每张技能卡都需满足自身「组内对应材料≥等级」才结算，不满足则跳过并在日志说明。互动技能自动以另一名玩家为目标。"},
  {t:"建造翻面", d:"从手牌选择卡牌，满足正面订单（建造需求）后翻面成为建筑，获得卡面分数并激活持续效果（如有）。建筑卡反面只能从手牌进行。"},{t:"建筑效果分布", d:"只有少数卡拥有建筑效果（晨祷/圣库/仪式/圣显/奉献/开门），拥有效果卡的得分低于同等级普通卡；5级卡全部拥有建筑效果。建筑效果在翻面后持续生效，同类可叠加。"},
  {t:"等级牌堆", d:"牌库按等级分为L1–L5。每2回合自动解锁下一级（第3回合L2…第9回合L5），建成「解锁牌堆」建筑可提前解锁。抽卡时从全部已解锁牌堆中随机抽取，解锁高级牌堆后仍可能抽到低级牌。"}
];
function openGlossary(anchor) {
  const body = document.getElementById("glossaryBody");
  body.innerHTML = "";
  // 资源
  let html = '<div class="gl-sec"><div class="gl-sec-title">9 种资源（不分等级）</div><div class="gl-grid">';
  RES_ORDER.forEach(r => {
    const sd = RES_DEF[r];
    html += '<div class="gl-item"><svg class="res-ico" viewBox="0 0 16 16" style="width:22px;height:22px;color:' + sd.color + '" aria-hidden="true">' + RES_ICO[r] + '</svg><b>' + sd.name + '</b></div>';
  });
  html += '</div></div>';
  // 技能
  html += '<div class="gl-sec"><div class="gl-sec-title">14 类技能（1AP发动，需组内对应材料≥等级，N=卡牌等级）</div>';
  Object.keys(SKILL_DEF).forEach(key => {
    const sd = SKILL_DEF[key];
    html += '<div class="gl-item wide"><span class="sk-letter" style="background:' + sd.color + '">' + key + '</span><div><b>' + sd.name + '</b>：' + sd.desc + ' <em>（需组内对应材料×N）</em>' + (sd.interactive ? ' <em>（互动：需选择目标玩家）</em>' : '') + '</div></div>';
  });
  html += '</div>';
  // 建筑效果
  html += '<div class="gl-sec"><div class="gl-sec-title">6 类建筑效果（翻面建造后激活）</div>';
  Object.keys(BUILD_EFFECT).forEach(key => {
    const be = BUILD_EFFECT[key];
    html += '<div class="gl-item wide"><div><b>' + be.name + '</b>：' + be.desc + '</div></div>';
  });
  html += '</div>';
  // 规则
  html += '<div class="gl-sec"><div class="gl-sec-title">规则速览</div>';
  RULE_TERMS.forEach(rt => {
    html += '<div class="gl-item wide"><div><b>' + rt.t + '</b>：' + rt.d + '</div></div>';
  });
  html += '</div>';
  body.innerHTML = html;
  // 若指定锚点技能，高亮滚动
  if (anchor && SKILL_DEF[anchor]) {
    const items = body.querySelectorAll(".gl-item.wide");
    items.forEach(it => { if (it.textContent.indexOf(SKILL_DEF[anchor].name) >= 0) { it.classList.add("gl-hl"); it.scrollIntoView({ block: "center" }); } });
  }
  document.getElementById("glossaryOverlay").classList.add("show");
}
function closeGlossary() { document.getElementById("glossaryOverlay").classList.remove("show"); }

// ========== 重开 ==========
function restart() {
  document.getElementById("endgameOverlay").classList.remove("show");
  document.getElementById("targetOverlay").classList.remove("show");
  document.getElementById("playOverlay").classList.remove("show");
  document.getElementById("logLines").innerHTML = "";
  const ba = document.getElementById("buildArea");
  if (ba) ba.remove();
  initGame();
}
